[package]
name = "candlec"
version = "1.1.0"
edition = "2024"
description = "Candle Assembly Compiler"
license = "GPL-3.0-only"
repository = "https://github.com/candle-ecosystem/candlec"

[[bin]]
name = "candlec"
path = "src/main.rs"

[dependencies]
candlevm = "1"
clap = { version = "4.6.7", features = ["derive"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
